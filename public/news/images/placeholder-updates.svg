<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="100%" stop-color="#091510"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ffae" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00ffae" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ffae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Large dim label -->
  <text x="400" y="260" text-anchor="middle" font-size="128" font-weight="800"
        font-family="system-ui,-apple-system,sans-serif" fill="#00ffae" fill-opacity="0.04" letter-spacing="-3">
    UPDATES
  </text>
  <!-- Category icon: rotate/refresh (scaled from 24x24 to 80x80) -->
  <g transform="translate(360, 140) scale(3.33)" stroke="#00ffae" stroke-opacity="0.45" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
  </g>
  <!-- Top row -->
  <text x="36" y="30" font-size="10" font-family="system-ui,sans-serif" fill="#00ffae" fill-opacity="0.5" letter-spacing="0.15em" font-weight="600">UPDATES</text>
  <text x="764" y="30" text-anchor="end" font-size="10" font-family="system-ui,sans-serif" fill="#00ffae" fill-opacity="0.3" letter-spacing="0.12em">ETHEREUM CLASSIC</text>
  <!-- Bottom bar -->
  <rect x="0" y="345" width="800" height="55" fill="#00ffae" fill-opacity="0.025"/>
  <line x1="0" y1="345" x2="800" y2="345" stroke="#00ffae" stroke-opacity="0.08" stroke-width="1"/>
</svg>
