<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Scoped fontconfig for rendering ethereumclassic.com brand assets.

  Makes the vendored fonts in this directory discoverable WITHOUT installing them
  system-wide:

      FONTCONFIG_FILE="$PWD/brand/fonts/fonts.conf" node brand/scripts/render-og.mjs

  `prefix="relative"` resolves the directory relative to THIS file, so the config
  is portable across machines and CI with no absolute paths.

  Deliberately hermetic: /etc/fonts/fonts.conf is NOT included.

  This is not caution for its own sake — it is the bug this file exists to stop.
  The card was rendered for several rounds in Noto Sans without anyone noticing,
  because the SVG asked for "Inter" and no family by that exact name was
  installed; fontconfig substituted silently and the result still looked
  plausible. The installed family is "Inter Variable". Excluding system fonts
  means a missing or mismatched face fails loudly instead of falling back.
-->
<fontconfig>
  <!-- The vendored brand fonts — the ONLY fonts visible to a scoped render. -->
  <dir prefix="relative">.</dir>

  <!-- No system fonts, no user fonts. Every render, local or CI, uses exactly
       the files in this directory. -->

  <!-- The SVG asks for "Inter" first; map it onto the vendored variable family
       so the source stays readable and matches what next/font serves. -->
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>

  <alias><family>sans-serif</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
