<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ethereum Classic">
  <!--
    The flat Ethereum Classic mark, as used on this site's OG card.

    Source: olympiadao/olympia-brand/logo/ETC-logo.svg, which is the canonical
    silhouette. Only the fill changes here: that file ships #33FF99, and this one
    takes currentColor so a consumer sets the color at the point of use rather
    than forking the file per palette.

    This is the FLAT mark, deliberately. public/etc-network/ holds the official
    full-color faceted diamond, which is the network's own identity asset; the
    flat silhouette is what the website's own chrome is built from, because
    multi-tone facets turn to mud below about 32px.
  -->
