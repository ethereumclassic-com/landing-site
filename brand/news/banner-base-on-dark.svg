<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The art every news article's banner is drawn on, for an article shown on a
    DARK page. Generated by brand/scripts/render-news-banners.py. Do
    not hand-edit: the next run overwrites it. Change the generator instead.

    Substrate and instrument chrome only. The reticle, the category glyph, the
    subject and the readout are drawn per article at build, by
    app/news/lib/banner.tsx, centered on y 200.
  -->
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8faf9"/><stop offset="45%" stop-color="#f1f5f3"/><stop offset="100%" stop-color="#eef3f1"/>
    </linearGradient>
    <radialGradient id="w1" gradientUnits="userSpaceOnUse" cx="400" cy="-120" r="920"
      gradientTransform="translate(400,-120) scale(1,0.28) translate(-400,120)">
      <stop offset="0%" stop-color="#007a53" stop-opacity="0.09"/><stop offset="62%" stop-color="#007a53" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" gradientUnits="userSpaceOnUse" cx="150" cy="80" r="620"
      gradientTransform="translate(150,80) scale(1,0.30) translate(-150,-80)">
      <stop offset="0%" stop-color="#007a53" stop-opacity="0.05"/><stop offset="55%" stop-color="#007a53" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w3" gradientUnits="userSpaceOnUse" cx="660" cy="300" r="520"
      gradientTransform="translate(660,300) scale(1,0.44) translate(-660,-300)">
      <stop offset="0%" stop-color="#00503c" stop-opacity="0.04"/><stop offset="55%" stop-color="#00503c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#ramp)"/>
  <rect width="800" height="400" fill="url(#w1)"/>
  <rect width="800" height="400" fill="url(#w2)"/>
  <rect width="800" height="400" fill="url(#w3)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <rect width="800" height="400" filter="url(#grain)" opacity="0.03"/>

